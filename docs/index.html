<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bug Hunter — Virtual Errors Dictionary</title>
  <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111; }
    #container { width: 100vw; height: 100svh; }
    #status { position: fixed; top: 10px; left: 10px; z-index: 9999; padding: 8px 12px; color: #fff; background: rgba(0,0,0,.75); font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="status">Starting Bug Hunter…</div>
  <div id="container"></div>
  <script type="module">
    const status = document.getElementById("status");
    try {
      status.textContent = "Loading Java runtime…";
      await cheerpjInit({ version: 11, status: "none" });
      status.textContent = "Starting Bug Hunter…";
      cheerpjCreateDisplay(-1, -1, document.getElementById("container"));
      const exitCode = await cheerpjRunJar("/app/BugHunter.jar");
      console.log("Bug Hunter exited with code:", exitCode);
      status.textContent = "Bug Hunter exited.";
    } catch (error) {
      console.error("Bug Hunter startup error:", error);
      status.textContent = "Bug Hunter failed to start. Open DevTools → Console for details.";
      const pre = document.createElement("pre");
      pre.style.cssText = "color:#fff;padding:24px;white-space:pre-wrap;font:14px monospace;margin-top:48px";
      pre.textContent = "Bug Hunter startup error:\n\n" + (error?.stack || error);
      document.body.appendChild(pre);
    }
  </script>
</body>
</html>
