<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bug Hunter — Virtual Errors Dictionary</title>
  <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111; }
    #container { width: 100vw; height: 100svh; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script type="module">
    (async () => {
      try {
        await cheerpjInit({ version: 11, status: "splash" });
        cheerpjCreateDisplay(-1, -1, document.getElementById("container"));
        const exitCode = await cheerpjRunJar("/app/BugHunter.jar");
        console.log("Bug Hunter exited with code:", exitCode);
      } catch (error) {
        console.error("Bug Hunter startup error:", error);
        const pre = document.createElement("pre");
        pre.style.cssText = "color:#fff;padding:24px;white-space:pre-wrap;font:14px monospace";
        pre.textContent = "Bug Hunter could not start.\n\n" + (error?.stack || error);
        document.body.appendChild(pre);
      }
    })();
  </script>
</body>
</html>
